    <text x="400" y="535">signs webhook (HMAC)</text>
    <text x="692" y="535">verifies signature</text><text x="692" y="558">replies 200 fast</text>
    <text x="992" y="535">reliable delivery</text>
    <text x="1292" y="535">idempotent:</text><text x="1292" y="558">applies once</text>
    <text x="692" y="832">send first, then delete</text>
    <text x="992" y="832">parked, not lost</text>
    <text x="1292" y="832">team is notified</text>
  </g>

